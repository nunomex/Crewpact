<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hoje · D suavizada · D / D1 / D2 / D3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1B; --paper:#FFFFFF; --soft:#F2F2F0; --soft2:#FAFAF9; --line:#ECECEA;
    --red:#F5402C; --redsoft:#FDE9E4; --grey:#C2C2C0; --sub:#6B6B66;
    --green:#1F9E6E; --greensoft:#E2F4EC; --warn:#E8932B; --warnsoft:#FBEAD2;
    --f:"Inter",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--f);background:#E7E8EA;color:#23262B;padding:48px 24px 90px}
  body::before{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(1100px 700px at 50% -6%,#fff,transparent 60%)}
  .intro{position:relative;z-index:1;text-align:center;max-width:820px;margin:0 auto 8px}
  .intro .k{font-weight:800;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--red);margin-bottom:12px}
  .intro h1{font-weight:700;font-size:34px;letter-spacing:-.02em;color:var(--ink)}
  .intro p{margin:12px auto 0;font-size:14.5px;line-height:1.6;color:#5C616A}

  .row{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:40px 30px;justify-content:center;max-width:1480px;margin:42px auto 0}
  figure{display:flex;flex-direction:column;align-items:center;gap:14px;margin:0}
  figcaption{text-align:center;max-width:290px}
  figcaption b{font-weight:800;font-size:15px;color:var(--ink)}
  figcaption p{font-size:12px;line-height:1.5;color:#646A72;margin-top:6px}
  figcaption em{font-style:normal;color:var(--green);font-weight:700}

  .phone{width:306px;height:672px;background:#fff;border-radius:46px;padding:9px;position:relative;flex:0 0 auto;
    box-shadow:0 38px 76px -34px rgba(20,22,26,.5),0 6px 16px -10px rgba(20,22,26,.3)}
  .screen{width:100%;height:100%;background:var(--paper);border-radius:37px;overflow:hidden;position:relative}
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:90px;height:24px;background:#0A0A0A;border-radius:13px;z-index:60}
  .hdr{padding:46px 17px 8px}
  .hdr .e{font-weight:800;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--sub);display:flex;align-items:center;gap:7px}
  .hdr .e i{width:7px;height:7px;border-radius:50%;background:var(--red)}
  .hdr h2{font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--ink);margin-top:7px}

  .body{position:absolute;left:0;right:0;top:112px;bottom:0;padding:2px 16px 14px;overflow:hidden}

  /* base do cartão (igual em todas as variantes) */
  .card{border-radius:15px;border:1px solid transparent;padding:10px 13px;margin-bottom:8px;position:relative;overflow:hidden}
  .ch{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .green{background:var(--green)} .amber{background:var(--warn)} .red{background:var(--red)} .ink{background:var(--ink)}
  .q{flex:1;font-weight:800;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
  .cv{color:var(--grey);font-weight:800}
  .ans{font-weight:700;font-size:13.5px;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}

  /* ===== D (atual) — cartão todo pintado ===== */
  .vD .card.ok{background:var(--soft2);border-color:var(--line)}
  .vD .card.gr{background:var(--greensoft);border-color:#CCEBDD}
  .vD .card.wn{background:var(--warnsoft);border-color:#F2DDB6}
  .vD .card.rd{background:var(--redsoft);border-color:#F6CFC7}
  .vD .card.gr .q{color:#2A7A5C} .vD .card.wn .q{color:#9A6B1E} .vD .card.rd .q{color:#9A4034}
  .vD .card.rd .ans{color:#C9331F}

  /* ===== D1 — verde calmo (ok recua p/ quase-branco; aviso/perigo cheios) ===== */
  .vD1 .card.ok{background:#fff;border-color:var(--line)}
  .vD1 .card.gr{background:#F4FAF7;border-color:#E6F1EB}
  .vD1 .card.wn{background:var(--warnsoft);border-color:#F2DDB6}
  .vD1 .card.rd{background:var(--redsoft);border-color:#F6CFC7}
  .vD1 .card.wn .q{color:#9A6B1E} .vD1 .card.rd .q{color:#9A4034}
  .vD1 .card.rd .ans{color:#C9331F}

  /* ===== D2 — faixa de cor à esquerda, cartão neutro ===== */
  .vD2 .card{background:var(--soft2);border-color:var(--line);padding-left:16px}
  .vD2 .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .vD2 .card.gr::before{background:var(--green)}
  .vD2 .card.wn::before{background:var(--warn)}
  .vD2 .card.rd::before{background:var(--red)}
  .vD2 .card.ok::before{background:#D4D4D1}
  .vD2 .card .d{display:none}
  .vD2 .card.rd .ans{color:#C9331F}

  /* ===== D3 — só ícone + título a cor, cartão branco ===== */
  .vD3 .card{background:#fff;border-color:var(--line)}
  .vD3 .card.gr .q{color:#1F8E63} .vD3 .card.wn .q{color:#C57A12} .vD3 .card.rd .q{color:var(--red)}
  .vD3 .card.rd .ans{color:#C9331F}

  .dock{position:absolute;left:15px;right:15px;bottom:16px;display:flex;justify-content:space-around;height:50px;background:var(--ink);border-radius:20px;align-items:center;z-index:40}
  .dock i{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.3)} .dock i.on{background:#fff}
  .foot{text-align:center;color:#8A9099;font-size:12px;padding:40px;font-weight:600}
</style>
</head>
<body>
  <div class="intro">
    <div class="k">Hoje · suavizar a D</div>
    <h1>D atual vs 3 formas de acalmar</h1>
    <p>O mesmo quadro nos quatro — 3 verdes, 1 aviso, 2 neutros e <b>1 vermelho</b> (Médico expirado). Repara em qual é que o <b>vermelho salta mais</b> sem o ecrã ficar uma parede de cor.</p>
  </div>

  <div class="row">
    <figure><div class="phone"><div class="screen"><div class="island"></div>
      <div class="hdr"><div class="e"><i></i>EASYJET · AE · PILOTO</div><h2>Hoje</h2></div>
      <div class="body vD"></div>
      <div class="dock"><i class="on"></i><i></i><i></i><i></i><i></i></div>
    </div></div><figcaption><b>D — atual</b><p>Tudo pintado. Forte, mas com tudo ok fica "muito verde" e o vermelho compete com a cor toda à volta.</p></figcaption></figure>

    <figure><div class="phone"><div class="screen"><div class="island"></div>
      <div class="hdr"><div class="e"><i></i>EASYJET · AE · PILOTO</div><h2>Hoje</h2></div>
      <div class="body vD1"></div>
      <div class="dock"><i class="on"></i><i></i><i></i><i></i><i></i></div>
    </div></div><figcaption><b>D1 — verde calmo</b><p>O "ok" recua para quase-branco; <em>só</em> o aviso e o perigo ficam cheios. O vermelho grita. <b>A minha preferida.</b></p></figcaption></figure>

    <figure><div class="phone"><div class="screen"><div class="island"></div>
      <div class="hdr"><div class="e"><i></i>EASYJET · AE · PILOTO</div><h2>Hoje</h2></div>
      <div class="body vD2"></div>
      <div class="dock"><i class="on"></i><i></i><i></i><i></i><i></i></div>
    </div></div><figcaption><b>D2 — faixa lateral</b><p>Risca de cor à esquerda, cartão neutro. Elegante e moderno; a cor lê-se na margem sem encher o cartão.</p></figcaption></figure>

    <figure><div class="phone"><div class="screen"><div class="island"></div>
      <div class="hdr"><div class="e"><i></i>EASYJET · AE · PILOTO</div><h2>Hoje</h2></div>
      <div class="body vD3"></div>
      <div class="dock"><i class="on"></i><i></i><i></i><i></i><i></i></div>
    </div></div><figcaption><b>D3 — só título a cor</b><p>Cartão branco; só o ponto e o título ganham cor. O mais sóbrio — mas o estado lê-se menos à distância.</p></figcaption></figure>
  </div>

  <div class="foot">CrewPact · Hoje · D / D1 / D2 / D3</div>

<script>
  var CARDS = [
    {st:'gr', dot:'green', q:'Estou legal?',     a:'Sim, dentro dos limites'},
    {st:'wn', dot:'amber', q:'Quanto falta?',    a:'Serviço 7d · 5 h de 60 h'},
    {st:'ok', dot:'ink',   q:'Quando trabalho?', a:'Amanhã · 06:05 · LIS-LGW'},
    {st:'gr', dot:'green', q:'Tenho descanso?',  a:'Sim · 12:00 antes do report'},
    {st:'gr', dot:'green', q:'Mudou a escala?',  a:'Sem alterações'},
    {st:'ok', dot:'ink',   q:'Quanto recebo?',   a:'8 923 € · este mês'},
    {st:'rd', dot:'red',   q:'Validades?',       a:'Médico Classe 1 expirado'},
  ];
  var html = CARDS.map(function(c){
    return '<div class="card '+c.st+'"><div class="ch"><span class="d '+c.dot+'"></span>'+
           '<span class="q">'+c.q+'</span><span class="cv">&#8250;</span></div>'+
           '<div class="ans">'+c.a+'</div></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.body'), function(b){ b.innerHTML = html; });
</script>
</body>
</html>
