<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Confirmar import — à prova de falha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1B; --paper:#FFFFFF; --canvas:#FFFFFF; --card:#FFFFFF;
    --soft:#F2F2F0; --soft2:#FAFAF9; --line:#ECECEA; --linestrong:#D4D4D1;
    --red:#F5402C; --redsoft:#FDE9E4; --green:#1F9E6E; --greensoft:#E2F4EC; --greentext:#2A7A5C;
    --warn:#E8932B; --warnsoft:#FBEAD2; --warntext:#9A6B1E; --sub:#6B6B66; --brand:#1F4E79;
    --inter:"Inter",sans-serif; --disp:"Space Grotesk",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--inter);background:#E7E8EA;color:#23262B;padding:50px 24px 90px}
  body::before{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(1100px 720px at 50% -6%,#fff,transparent 60%)}
  .intro{position:relative;z-index:1;text-align:center;max-width:820px;margin:0 auto 8px}
  .intro .k{font-weight:800;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--brand);margin-bottom:14px}
  .intro h1{font-weight:700;font-size:30px;letter-spacing:-.02em;color:var(--ink)}
  .intro p{margin:12px auto 0;font-size:14px;line-height:1.6;color:#5C616A}
  .intro b{color:var(--ink);font-weight:700}

  .row{position:relative;z-index:1;display:flex;justify-content:center;margin:40px auto 0}
  figure{display:flex;flex-direction:column;align-items:center;gap:16px;margin:0}
  figcaption{text-align:center;max-width:360px}
  figcaption .tag{display:inline-block;font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--red);border-radius:99px;padding:4px 10px;margin-bottom:7px}
  figcaption p{font-size:12.5px;line-height:1.5;color:#646A72}

  .phone{width:374px;height:812px;background:#fff;border-radius:50px;padding:11px;position:relative;flex:0 0 auto;
    box-shadow:0 40px 80px -34px rgba(20,22,26,.5),0 6px 16px -10px rgba(20,22,26,.3)}
  .screen{width:100%;height:100%;background:var(--canvas);border-radius:40px;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#0A0A0A;border-radius:16px;z-index:60}
  .stat{position:absolute;top:18px;left:30px;right:28px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink);z-index:55}
  .body{flex:1;padding:60px 20px 0;overflow:hidden;display:flex;flex-direction:column}

  .nav{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .eyebrow{font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--red)}
  .h1{font-family:var(--disp);font-weight:700;font-size:32px;letter-spacing:-.025em;color:var(--ink)}
  .close{width:40px;height:40px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--ink)}

  /* cartão-resumo (âmbar) */
  .summ{display:flex;align-items:center;gap:13px;background:var(--warnsoft);border-radius:16px;padding:14px;margin-top:18px}
  .summ .ic{width:46px;height:46px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .summ .t{font-family:var(--inter);font-weight:800;font-size:16px;color:var(--ink)}
  .summ .s{font-family:var(--inter);font-weight:600;font-size:13px;color:var(--warntext);margin-top:2px;line-height:1.35}
  .summ .s b{font-weight:800}

  .list{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:11px;margin-top:16px}
  .card{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 14px -11px rgba(20,22,26,.16)}
  .card.fix{background:#FEFBF4;border-color:#F2DEB6;flex-wrap:wrap}
  .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ic.ok{background:var(--greensoft)} .ic.warn{background:var(--warnsoft)}
  .mid{flex:1;min-width:0}
  .dt{font-family:var(--inter);font-weight:800;font-size:15.5px;color:var(--ink)}
  .sub{font-family:var(--inter);font-weight:600;font-size:13.5px;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums}
  .sub.warnt{color:var(--warntext);font-weight:700}
  .eur{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--greentext);font-variant-numeric:tabular-nums;flex:0 0 auto;padding-top:1px}
  .eur.muted{color:var(--linestrong)}
  /* correção inline */
  .fixrow{display:flex;gap:10px;width:100%;margin-top:12px}
  .inp{flex:1;border:1.5px solid var(--linestrong);border-radius:12px;padding:11px 13px;font-family:var(--inter);font-weight:700;font-size:14px;color:var(--ink);background:#fff}
  .inp span{color:var(--sub);font-weight:600}
  .corr{background:var(--ink);color:#fff;border-radius:12px;padding:0 18px;display:flex;align-items:center;font-family:var(--inter);font-weight:800;font-size:14px;flex:0 0 auto}

  .foot{padding:14px 20px 18px}
  .confirm{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border-radius:18px;padding:18px;
    font-family:var(--inter);font-weight:800;font-size:16px;box-shadow:0 14px 30px -12px rgba(20,22,26,.45)}
  .confirm .e{font-family:var(--disp);font-weight:700}
  .hint{text-align:center;font-family:var(--inter);font-weight:600;font-size:12.5px;color:var(--sub);margin-top:12px}
  .hint b{color:var(--warntext);font-weight:800}

  svg{display:block}
</style>
</head>
<body>
  <div class="intro">
    <div class="k">CrewPact · página de import</div>
    <h1>Confirmar import — "à prova de falha"</h1>
    <p>Lê o PDF/calendário, mostra <b>quantas leu / quantas estão prontas / quantas a corrigir</b>, deixa <b>corrigir inline</b> (aeroporto não reconhecido) e só confirma o que está pronto. <b>+€ a verde.</b></p>
  </div>

  <div class="row">
    <figure>
      <div class="phone"><div class="screen">
        <div class="island"></div>
        <div class="stat"><span>9:41</span><span>●●● ▮</span></div>
        <div class="body">
          <div class="nav">
            <div>
              <div class="eyebrow"><i></i>Escala · Importar</div>
              <div class="h1">Confirmar import</div>
            </div>
            <div class="close">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </div>
          </div>

          <!-- resumo -->
          <div class="summ">
            <div class="ic">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8932B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".6" fill="#E8932B" stroke="none"/></svg>
            </div>
            <div>
              <div class="t">Li 14 atividades</div>
              <div class="s"><b>12 prontas</b> · <b>2 a corrigir</b> antes de somar ao per-diem</div>
            </div>
          </div>

          <div class="list">
            <!-- pronto -->
            <div class="card">
              <div class="ic ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F9E6E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
              <div class="mid"><div class="dt">Seg 22 · LIS-OPO-LIS</div><div class="sub">05:40 → 12:30 · 2 setores</div></div>
              <div class="eur">+28 €</div>
            </div>

            <!-- pronto -->
            <div class="card">
              <div class="ic ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F9E6E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
              <div class="mid"><div class="dt">Qua 24 · LIS-FNC-LIS</div><div class="sub">06:10 → 13:20 · 2 setores</div></div>
              <div class="eur">+44 €</div>
            </div>

            <!-- a corrigir (aeroporto não reconhecido) -->
            <div class="card fix">
              <div class="ic warn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A6B1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg></div>
              <div class="mid"><div class="dt">Sex 26 · LIS-XXX</div><div class="sub warnt">Aeroporto "XXX" não reconhecido</div></div>
              <div class="eur muted">— €</div>
              <div class="fixrow">
                <div class="inp">LIS-<span>destino…</span></div>
                <div class="corr">Corrigir</div>
              </div>
            </div>

            <!-- sem rota (standby) -->
            <div class="card">
              <div class="ic warn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A6B1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg></div>
              <div class="mid"><div class="dt">Dom 28 · standby</div><div class="sub">Sem rota — não conta para per-diem</div></div>
              <div class="eur muted">— €</div>
            </div>
          </div>

          <div class="foot">
            <div class="confirm">Confirmar 12 duties · <span class="e">+312 €</span></div>
            <div class="hint">Corrige as <b>2</b> para somarem ao per-diem</div>
          </div>
        </div>
      </div></div>
      <figcaption><span class="tag">à prova de falha</span><p>Réplica fiel da tua imagem. Único ajuste: <b>+€ a verde</b> (regra "dinheiro = verde"); botão Confirmar escuro como na imagem.</p></figcaption>
    </figure>
  </div>
</body>
</html>
